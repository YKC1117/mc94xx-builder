<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>MC94xx 選型助手</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#132033;--muted:#64748b;--line:#dbe3ee;--blue:#1463ff;--green:#137a4f;--greenbg:#eaf8f1;--amber:#9a6400;--amberbg:#fff7df;--red:#b42318;--redbg:#fff0ee;--soft:#eef4ff;--shadow:0 12px 30px rgba(15,23,42,.08);--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;line-height:1.5}.top{background:linear-gradient(135deg,#0b1220,#16243c);color:#fff;padding:26px 18px 22px}.wrap{max-width:1080px;margin:auto}.brand{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#8eb7ff}.top h1{margin:4px 0 6px;font-size:clamp(27px,6vw,40px)}.top p{margin:0;color:#cbd5e1;max-width:760px;font-size:14px}.badge{flex:none;background:#1f3150;border:1px solid #35517f;border-radius:999px;padding:7px 10px;font-size:12px;color:#dce9ff}.content{padding:18px 14px 50px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#e8eef6;border-radius:14px;padding:5px;margin-bottom:16px;position:sticky;top:0;z-index:10}.tab{border:0;background:transparent;padding:11px 8px;border-radius:10px;font-weight:800;color:#526174;cursor:pointer}.tab.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(15,23,42,.09)}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:1fr;gap:16px}@media(min-width:880px){.grid{grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr)}.result{position:sticky;top:70px;align-self:start}}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}.card h2{font-size:18px;margin:0 0 4px}.hint{font-size:13px;color:var(--muted);margin:0 0 15px}.step{padding:15px 0;border-top:1px solid var(--line)}.step:first-of-type{border-top:0;padding-top:3px}.step-head{display:flex;gap:9px;align-items:center;margin-bottom:9px}.num{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:var(--soft);color:var(--blue);font-weight:900;font-size:12px}.step-title{font-weight:850}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:540px){.choices,.choices.three{grid-template-columns:1fr}}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{display:block;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:64px;cursor:pointer;background:#fff}.choice input:checked+label{border:2px solid var(--blue);padding:10px 11px;background:var(--soft)}.choice strong{display:block;font-size:14px}.choice small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.select-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:540px){.select-row{grid-template-columns:1fr}}select,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:12px;font:inherit;outline:none}select:focus,input[type=text]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,99,255,.12)}select:disabled{background:#f3f5f7;color:#8a94a3}.field label{display:block;font-size:12px;font-weight:800;color:#526174;margin:0 0 5px}.micro{font-size:11.5px;color:var(--muted);margin-top:5px}.result-card{background:linear-gradient(145deg,#0c1424,#172844);color:#fff;border-radius:18px;padding:18px}.result-label{font-size:11px;letter-spacing:.1em;color:#94a3b8}.sku{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(20px,5vw,28px);font-weight:850;word-break:break-all;margin:7px 0 13px}.status{display:inline-flex;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800}.status.ok{background:#164e3a;color:#b7f7d6}.status.warn{background:#5c3b08;color:#ffe3a2}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn{border:0;border-radius:11px;padding:11px 10px;font-weight:850;cursor:pointer}.btn.primary{background:#2b72ff;color:#fff}.btn.secondary{background:#243650;color:#edf4ff;border:1px solid #405575}.btn.light{background:#edf3ff;color:#1454d2}.mini{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.mini-title{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}.spec-list{display:grid;gap:7px}.spec-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;border-top:1px dashed #e0e6ef;padding-top:7px}.spec-row:first-child{border-top:0;padding-top:0}.spec-row span:first-child{color:var(--muted)}.notice{border-radius:13px;padding:11px 12px;font-size:12px;margin-top:12px}.notice.ok{background:var(--greenbg);color:var(--green)}.notice.warn{background:var(--amberbg);color:var(--amber)}.notice.bad{background:var(--redbg);color:var(--red)}.empty{background:#fff;border:1px dashed #bfc9d7;border-radius:16px;padding:22px 16px;color:var(--muted);font-size:13px;text-align:center}.decode-box{margin-top:8px}.decode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}@media(max-width:620px){.decode-grid{grid-template-columns:1fr}}.decode-item{border:1px solid var(--line);border-radius:12px;padding:10px}.decode-item b{display:block;font-size:12px;color:var(--muted)}.decode-item span{display:block;font-size:14px;font-weight:800;margin-top:2px}.fixed{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0 2px}.pill{background:#f1f5f9;border:1px solid #dbe4ef;border-radius:999px;padding:5px 8px;font-size:11px;color:#4a5a6d}.footer{color:var(--muted);font-size:11.5px;margin-top:18px;text-align:center}.footer a{color:#436da9}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);background:#111827;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.18s;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top"><div class="wrap brand"><div><div class="eyebrow">Zebra MC9400 / MC9450</div><h1>MC94xx 選型助手</h1><p>從客戶需求反推規格、建立訂購料號，也可貼上既有料號快速解碼。</p></div><div class="badge">工程／業務工具</div></div></header>
<main class="content wrap">
<nav class="tabs"><button class="tab active" data-tab="recommend">需求推薦</button><button class="tab" data-tab="builder">規格組料號</button><button class="tab" data-tab="decode">料號解碼</button></nav>
<section class="panel active" id="recommend"><div class="grid"><div class="card"><h2>客戶只講需求？照這裡選</h2><p class="hint">不預設任何答案，照客戶實際需求選即可。</p><div id="recommendForm"></div></div><aside class="result" id="recommendResult"></aside></div></section>
<section class="panel" id="builder"><div class="grid"><div class="card"><h2>已知規格，直接組料號</h2><p class="hint">固定結構以小字顯示，不會替你預選可變規格。</p><div class="fixed"><span class="pill">G = Gun Grip</span><span class="pill">1 = 固定平台碼</span><span class="pill">6 = 6GB / 128GB</span><span class="pill">Android GMS</span></div><div id="builderForm"></div></div><aside class="result" id="builderResult"></aside></div></section>
<section class="panel" id="decode"><div class="card"><h2>輸入料號，直接看人話</h2><p class="hint">範例：MC9401-0G1M6GSS-A6</p><div class="decode-box"><input id="decodeInput" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><div id="decodeResult"></div></div></section>
<div class="footer">選型輔助工具，非 Zebra 官方工具。實際下單仍應以代理商／Zebra 當期報價與區域供貨為準。</div>
</main><div class="toast" id="toast">已複製</div>
<script>
(()=>{'use strict';
const Q=(s,r=document)=>r.querySelector(s),QA=(s,r=document)=>[...r.querySelectorAll(s)];
const DATA={scan:{J:'SE4770 標準距離',M:'SE58 Extended Range',P:'SE4770 + 前後相機',R:'SE58 + 前後相機'},keypad:{A:'29 鍵 Shifted Alpha',B:'34 鍵 Numeric',C:'43 鍵 Shifted Alpha',D:'53 鍵 Standard',E:'53 鍵 VT Emulator',G:'53 鍵 IBM 5250 Emulator',H:'58 鍵 Alpha Numeric Function'},env:{S:'Standard 標準環境',C:'Cold Storage 冷凍庫',N:'Non-Incendive 防爆環境'},battery:{S:'標準／環境對應電池',B:'7000mAh BLE 電池'},region:{A6:'Rest of World',NA:'North America',TR:'Turkey'}};
const OFFICIAL_A6=new Set(['MC9401-0G1J6BSS-A6','MC9401-0G1J6CSS-A6','MC9401-0G1J6DSS-A6','MC9401-0G1J6ESS-A6','MC9401-0G1J6GSS-A6','MC9401-0G1J6HSS-A6','MC9401-0G1M6ASS-A6','MC9401-0G1M6BSS-A6','MC9401-0G1M6CSB-A6','MC9401-0G1M6CSS-A6','MC9401-0G1M6DSB-A6','MC9401-0G1M6DSS-A6','MC9401-0G1M6ESS-A6','MC9401-0G1M6GSS-A6','MC9401-0G1M6HSS-A6','MC9401-0G1P6DSB-A6','MC9401-0G1P6DSS-A6','MC9401-0G1P6GSS-A6','MC9401-0G1R6ASS-A6','MC9401-0G1R6BSS-A6','MC9401-0G1R6CSS-A6','MC9401-0G1R6DSS-A6','MC9401-0G1R6ESS-A6','MC9401-0G1R6GSS-A6','MC9401-0G1R6HSS-A6','MC945A-3G1J6BSS-A6','MC945A-3G1J6CSS-A6','MC945A-3G1J6DSS-A6','MC945A-3G1J6ESS-A6','MC945A-3G1J6GSS-A6','MC945A-3G1J6HSS-A6','MC945A-3G1M6ASS-A6','MC945A-3G1M6BSS-A6','MC945A-3G1M6CSS-A6','MC945A-3G1M6DSS-A6','MC945A-3G1M6ESS-A6','MC945A-3G1M6GSS-A6','MC945A-3G1M6HSS-A6','MC945A-3G1P6DSS-A6','MC945A-3G1P6GSS-A6','MC945A-3G1R6ASS-A6','MC945A-3G1R6BSS-A6','MC945A-3G1R6CSS-A6','MC945A-3G1R6DSS-A6','MC945A-3G1R6ESS-A6','MC945A-3G1R6GSS-A6','MC945A-3G1R6HSS-A6']);
const blank=()=>({model:'',distance:'',camera:'',keypad:'',env:'',battery:'',region:''});let rec=blank(),build=blank();
const complete=s=>s.model&&s.distance&&s.camera&&s.keypad&&s.env&&s.region&&(s.env!=='S'||s.battery);
function scanCode(s){return s.distance==='long'?(s.camera==='yes'?'R':'M'):(s.camera==='yes'?'P':'J')}
function modelPrefix(s){return s.model==='9450'?'MC945A':'MC9401'}function radioCode(s){return s.model==='9450'?'3':'0'}
function makeSku(s){return `${modelPrefix(s)}-${radioCode(s)}G1${scanCode(s)}6${s.keypad}${s.env}${s.env==='S'?s.battery:'S'}-${s.region}`}
function modelName(s){return s.model==='9450'?'MC9450｜Wi‑Fi 6E + 5G':'MC9400｜Wi‑Fi 6E'}
function batteryName(s){return s.env==='C'?'冷凍庫對應電池':s.env==='N'?'Non-Incendive 對應電池':DATA.battery[s.battery]}
function choice(name,value,title,small,checked){return `<div class="choice"><input type="radio" name="${name}" id="${name}_${value}" value="${value}" ${checked?'checked':''}><label for="${name}_${value}"><strong>${title}</strong><small>${small}</small></label></div>`}
const sel=(name,label,options,value,note='')=>`<div class="field"><label>${label}</label><select name="${name}"><option value="" ${!value?'selected':''} disabled>請選擇</option>${options.map(([k,v])=>`<option value="${k}" ${value===k?'selected':''}>${k}｜${v}</option>`).join('')}</select>${note?`<div class="micro">${note}</div>`:''}</div>`;
function recForm(s){return `<div class="step"><div class="step-head"><span class="num">1</span><span class="step-title">現場只有 Wi‑Fi，還是要離開 Wi‑Fi 也能用？</span></div><div class="choices">${choice('r_model','9400','只要 Wi‑Fi','MC9400｜Wi‑Fi 6E',s.model==='9400')}${choice('r_model','9450','需要 5G','MC9450｜Wi‑Fi 6E + 5G',s.model==='9450')}</div></div><div class="step"><div class="step-head"><span class="num">2</span><span class="step-title">條碼通常離多遠？</span></div><div class="choices">${choice('r_distance','near','手上／一般近距離','SE4770',s.distance==='near')}${choice('r_distance','long','高貨架／遠距離','SE58｜可達 30.5m 以上',s.distance==='long')}</div></div><div class="step"><div class="step-head"><span class="num">3</span><span class="step-title">主機需要拍照嗎？</span></div><div class="choices">${choice('r_camera','no','不用相機','純掃碼即可',s.camera==='no')}${choice('r_camera','yes','需要前後相機','驗收、貨損、文件拍照',s.camera==='yes')}</div></div><div class="step"><div class="step-head"><span class="num">4</span><span class="step-title">使用環境</span></div><div class="choices three">${choice('r_env','S','一般倉庫／工廠','Standard',s.env==='S')}${choice('r_env','C','冷凍庫','Cold Storage',s.env==='C')}${choice('r_env','N','危險／防爆區','Non-Incendive',s.env==='N')}</div></div><div class="step"><div class="step-head"><span class="num">5</span><span class="step-title">鍵盤與電池</span></div><div class="select-row">${sel('r_keypad','鍵盤',Object.entries(DATA.keypad),s.keypad)}${s.env==='C'||s.env==='N'?`<div class="field"><label>電池</label><select disabled><option>環境對應專用電池（自動）</option></select><div class="micro">選冷凍／防爆後由環境規格決定。</div></div>`:sel('r_battery','電池',Object.entries(DATA.battery),s.battery)}</div></div>`}
function buildForm(s){return `<div class="step"><div class="select-row">${sel('b_model','主機',[['9400','MC9400｜Wi‑Fi 6E'],['9450','MC9450｜Wi‑Fi 6E + 5G']],s.model)}${sel('b_region','區域碼',Object.entries(DATA.region),s.region,'台灣詢價常用 A6，但不替你預選。')}</div></div><div class="step">${sel('b_scan','掃描引擎／相機',[['near_no','J｜SE4770'],['long_no','M｜SE58 Extended Range'],['near_yes','P｜SE4770 + 前後相機'],['long_yes','R｜SE58 + 前後相機']],s.distance&&s.camera?`${s.distance}_${s.camera}`:'')}</div><div class="step"><div class="select-row">${sel('b_keypad','鍵盤',Object.entries(DATA.keypad),s.keypad)}${sel('b_env','環境',Object.entries(DATA.env),s.env)}</div></div><div class="step">${s.env==='C'||s.env==='N'?`<div class="field"><label>電池</label><select disabled><option>環境對應專用電池（自動）</option></select><div class="micro">此環境版本的電池代碼會自動帶入。</div></div>`:sel('b_battery','電池',Object.entries(DATA.battery),s.battery)}</div>`}
function resultHTML(s){if(!complete(s))return `<div class="empty">請把左邊需要的項目選完，完成後這裡才會產生料號。</div>`;const sku=makeSku(s),ok=s.region==='A6'&&OFFICIAL_A6.has(sku);return `<div class="result-card"><div class="result-label">ORDER PART NUMBER</div><div class="sku">${sku}</div><span class="status ${ok?'ok':'warn'}">${ok?'✓ 已在官方清單找到':'! 請向代理商確認此組合'}</span><div class="actions"><button class="btn primary" data-act="sku">複製料號</button><button class="btn secondary" data-act="inquiry">複製詢價文字</button><button class="btn secondary" data-act="spec">複製規格</button><button class="btn secondary" data-act="clear">全部清空</button></div></div><div class="mini"><div class="mini-title">規格摘要</div><div class="spec-list"><div class="spec-row"><span>連線</span><b>${modelName(s)}</b></div><div class="spec-row"><span>掃描</span><b>${DATA.scan[scanCode(s)]}</b></div><div class="spec-row"><span>記憶體</span><b>6GB / 128GB</b></div><div class="spec-row"><span>鍵盤</span><b>${DATA.keypad[s.keypad]}</b></div><div class="spec-row"><span>環境</span><b>${DATA.env[s.env]}</b></div><div class="spec-row"><span>電池</span><b>${batteryName(s)}</b></div></div></div>`}
function specText(s,sku){return `Zebra ${modelName(s)}\n料號：${sku}\n掃描：${DATA.scan[scanCode(s)]}\n記憶體：6GB RAM / 128GB Flash\n鍵盤：${DATA.keypad[s.keypad]}\n環境：${DATA.env[s.env]}\n電池：${batteryName(s)}\n區域：${DATA.region[s.region]}`}
function bindResult(root,stateGetter,clearer){QA('[data-act]',Q(root)).forEach(b=>b.onclick=()=>{const s=stateGetter(),act=b.dataset.act;if(act==='clear'){clearer();return}const sku=makeSku(s),text=act==='sku'?sku:act==='spec'?specText(s,sku):`您好，想詢問以下 Zebra MC94xx 規格的價格與交期：\n\n${specText(s,sku)}\n\n再麻煩協助確認此完整料號於台灣是否可供貨，謝謝。`;copy(text,act==='sku'?'已複製料號':act==='spec'?'已複製規格':'已複製詢價文字')})}
function copy(t,msg){navigator.clipboard?.writeText(t).then(()=>toast(msg)).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast(msg)})}function toast(t){const e=Q('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1300)}
function renderRec(){Q('#recommendForm').innerHTML=recForm(rec);Q('#recommendResult').innerHTML=resultHTML(rec);QA('[name^="r_"]').forEach(e=>e.onchange=()=>{const k=e.name.slice(2);rec[k]=e.value;if(k==='env'){rec.battery=''}renderRec()});bindResult('#recommendResult',()=>rec,()=>{rec=blank();renderRec()})}
function renderBuild(){Q('#builderForm').innerHTML=buildForm(build);Q('#builderResult').innerHTML=resultHTML(build);QA('[name^="b_"]').forEach(e=>e.onchange=()=>{const k=e.name.slice(2);if(k==='scan'){[build.distance,build.camera]=e.value.split('_')}else{build[k]=e.value;if(k==='env')build.battery=''}renderBuild()});bindResult('#builderResult',()=>build,()=>{build=blank();renderBuild()})}
function decodeSku(raw){const v=raw.trim().toUpperCase();if(!v)return null;const m=v.match(/^(MC9401|MC945A|MC945B)-([03])G1([JMPR])6([ABCDEGH])([SCN])([SB])-([A-Z0-9]{2})$/);if(!m)return {bad:true,value:v};const [,prefix,radio,scan,keypad,env,battery,region]=m,model=prefix==='MC9401'?'9400':'9450';return {value:v,state:{model,distance:['M','R'].includes(scan)?'long':'near',camera:['P','R'].includes(scan)?'yes':'no',keypad,env,battery,region},scan,radio,structural:radio===(model==='9400'?'0':'3')}}
function renderDecode(){const r=decodeSku(Q('#decodeInput').value),out=Q('#decodeResult');if(!r){out.innerHTML='';return}if(r.bad){out.innerHTML='<div class="notice bad">格式不像目前支援的 MC9400 / MC9450 訂購料號，請檢查是否打錯。</div>';return}const s=r.state,ok=r.structural&&s.region==='A6'&&OFFICIAL_A6.has(r.value);out.innerHTML=`<div class="notice ${ok?'ok':'warn'}">${ok?'✓ 已在內建官方料號清單找到。':r.structural?'料號結構可解析，正式下單前請再確認供貨。':'型號與無線平台碼不一致，請確認料號。'}</div><div class="decode-grid"><div class="decode-item"><b>主機</b><span>${modelName(s)}</span></div><div class="decode-item"><b>掃描</b><span>${DATA.scan[r.scan]}</span></div><div class="decode-item"><b>記憶體</b><span>6GB / 128GB</span></div><div class="decode-item"><b>鍵盤</b><span>${DATA.keypad[s.keypad]}</span></div><div class="decode-item"><b>環境</b><span>${DATA.env[s.env]}</span></div><div class="decode-item"><b>電池</b><span>${batteryName(s)}</span></div><div class="decode-item"><b>區域</b><span>${DATA.region[s.region]||s.region}</span></div></div><div class="actions" style="max-width:420px"><button class="btn light" id="dCopy">複製料號</button><button class="btn light" id="dBuild">帶入組料號</button></div>`;Q('#dCopy').onclick=()=>copy(r.value,'已複製料號');Q('#dBuild').onclick=()=>{build={...s};switchTab('builder');renderBuild()}}
function switchTab(id){QA('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));QA('.panel').forEach(p=>p.classList.toggle('active',p.id===id));window.scrollTo({top:0,behavior:'smooth'})}QA('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));Q('#decodeInput').oninput=renderDecode;renderRec();renderBuild();renderDecode();
})();
</script></body></html>
